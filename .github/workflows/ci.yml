name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A throwaway Postgres for the server suite. It never sees real data: the
    # suite migrates its own app_test schema and refuses any other.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # A value for CI only; it signs the sessions of throwaway test users.
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
