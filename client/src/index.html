<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover is load-bearing, not decoration: env(safe-area-inset-*)
         resolves to 0 without it, so the bottom tab bar's safe-area padding does
         nothing on a notched phone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- An SVG tab icon stays sharp at every size, so it needs no PNG fallback
         sibling. apple-touch-icon must be a PNG: iOS does not accept SVG. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Dashboard</title>
    <meta name="description" content="Track your training, food and habits." />
    <!-- The card a shared link shows (LinkedIn, iMessage, Slack). og:image and
         og:url must be absolute, so they name the production domain: a new
         domain means editing both. The picture's source is scripts/og-image.html. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dashboard" />
    <meta property="og:description" content="Track your training, food and habits." />
    <meta property="og:url" content="https://dashboard-v2-nine-phi.vercel.app/" />
    <meta property="og:image" content="https://dashboard-v2-nine-phi.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dashboard: track your training, food and habits" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
