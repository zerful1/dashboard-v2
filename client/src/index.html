<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover is load-bearing, not decoration: env(safe-area-inset-*)
         resolves to 0 without it, so the bottom tab bar's safe-area padding does
         nothing on a notched phone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- An SVG tab icon stays sharp at every size, so it needs no PNG fallback
         sibling. apple-touch-icon must be a PNG: iOS does not accept SVG. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
