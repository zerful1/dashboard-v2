<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover is load-bearing, not decoration: env(safe-area-inset-*)
         resolves to 0 without it, so the bottom tab bar's safe-area padding does
         nothing on a notched phone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0C0A09" />
    <title>Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
